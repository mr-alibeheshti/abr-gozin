version: "2.4"
services:
  abrgozin:
    image: ${ABRGOZIN_IMAGE:?Set the immutable release image}
    container_name: abrgozin
    restart: unless-stopped
    env_file: ./abrgozin.env
    environment:
      APP_BASE_PATH: ""
      PUBLIC_URL: https://abrgozin.ir
      HOST: 0.0.0.0
      DATA_DIR: /data
      MODEL_CACHE_DIR: /data/models
    ports:
      - "127.0.0.1:4322:4321"
    volumes:
      - /var/lib/abrgozin:/data
    networks:
      - public-sites
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 768m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  public-sites:
    external:
      name: server-data_default
