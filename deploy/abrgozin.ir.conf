# Include in nginx-proxy's /etc/nginx/vhost.d/abrgozin.ir.
# The production build uses the domain root as its application base path.
location / {
    resolver 127.0.0.11 valid=30s;
    set $abrgozin_backend http://abrgozin:4321;
    proxy_pass $abrgozin_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 45s;
    proxy_buffering off;
}
